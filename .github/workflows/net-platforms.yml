name: net-platforms

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  net-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check network crate formatting
        run: cargo fmt --all -- --check
      - name: Test network crate
        run: cargo test --locked -p mailcraft-net
